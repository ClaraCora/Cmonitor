name: security
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, .node-version, web-admin/package.json, web-admin/package-lock.json, web-admin/.npmrc, scripts/check-node-security.mjs, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, .node-version, web-admin/package.json, web-admin/package-lock.json, web-admin/.npmrc, scripts/check-node-security.mjs, .github/workflows/security.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny unsound
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify patched Node runtime
        run: node scripts/check-node-security.mjs
      - run: npm audit --package-lock-only --ignore-scripts --audit-level=high
        working-directory: web-admin
